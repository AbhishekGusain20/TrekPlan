<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Journal | TrekPlan</title>

    <link rel="stylesheet" href="journal.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">🏔️ TrekPlan</div>

        <a href="dashboard.html" class="back-btn">
            ← Dashboard
        </a>
    </header>


    <main class="container">

        <h1>My Travel Journal 📖</h1>

        <p class="subtitle">
            Save your favourite travel memories and experiences.
        </p>


        <!-- JOURNAL FORM -->

        <section class="journal-form">

            <h2 id="formTitle">Add Travel Memory</h2>

            <form id="journalForm">

                <div class="form-group">
                    <label for="location">Location</label>

                    <input
                        type="text"
                        id="location"
                        placeholder="e.g. Kedarkantha"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="rating">Rating</label>

                    <select id="rating" required>
                        <option value="">Select Rating</option>
                        <option value="1">⭐ 1/5</option>
                        <option value="2">⭐⭐ 2/5</option>
                        <option value="3">⭐⭐⭐ 3/5</option>
                        <option value="4">⭐⭐⭐⭐ 4/5</option>
                        <option value="5">⭐⭐⭐⭐⭐ 5/5</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="experience">Your Experience</label>

                    <textarea
                        id="experience"
                        rows="5"
                        placeholder="Write about your trip..."
                        required
                    ></textarea>
                </div>


                <div class="form-group">

                    <label for="photo">
                        Travel Photo 📸
                    </label>

                    <input
                        type="file"
                        id="photo"
                        accept="image/*"
                    >

                </div>


                <!-- PHOTO PREVIEW -->

                <div id="photoPreview"></div>


                <div class="form-buttons">

                    <button type="submit" id="saveBtn">
                        Save Memory
                    </button>

                    <button
                        type="button"
                        id="cancelBtn"
                        class="cancel-btn"
                        style="display:none;"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- JOURNAL MEMORIES -->

        <section class="memories-section">

            <h2>My Memories ❤️</h2>

            <div id="memoriesContainer">

                <!-- Memories will appear here -->

            </div>

        </section>

    </main>


    <script src="journal.js"></script>

</body>
</html>
