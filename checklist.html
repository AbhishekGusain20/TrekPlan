<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trip Checklist - TrekPlan</title>

    <link rel="stylesheet" href="checklist.css">
</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">


        <div class="sidebar-logo">

            <img src="TrekPlan-logo.png"
                 alt="TrekPlan">

        </div>


        <nav class="sidebar-nav">

            <p class="nav-title">
                MAIN MENU
            </p>


            <a href="dashboard.html"
               class="nav-link">

                <span class="nav-icon">⌂</span>

                <span>Dashboard</span>

            </a>


            <a href="dashboard.html#trips"
               class="nav-link">

                <span class="nav-icon">✈</span>

                <span>My Trips</span>

            </a>


            <a href="explore.html"
               class="nav-link">

                <span class="nav-icon">◎</span>

                <span>Explore</span>

            </a>


            <a href="budget.html"
               class="nav-link">

                <span class="nav-icon">₹</span>

                <span>Budget Planner</span>

            </a>


            <a href="journal.html"
               class="nav-link">

                <span class="nav-icon">▤</span>

                <span>Travel Journal</span>

            </a>


            <a href="map.html"
               class="nav-link ">

                <span class="nav-icon">⌖</span>

                <span>Maps</span>

            </a>


            <a href="checklist.html"
               class="nav-link active">

                <span class="nav-icon">✓</span>

                <span>Checklists</span>

            </a>


            <a href="community.html"
               class="nav-link ">

                <span class="nav-icon">♧</span>

                <span>Community</span>

            </a>

        </nav>


        <div class="sidebar-bottom">


            <a href="#"
               class="nav-link">

                <span class="nav-icon">⚙</span>

                <span>Settings</span>

            </a>


            <div class="user-profile">


                <div class="user-avatar"
                     id="userAvatar">

                    A

                </div>


                <div class="user-info">

                    <strong id="userName">
                        AVI
                    </strong>

                    <span>
                        Traveler
                    </span>

                </div>


                <button
                    class="logout-button"
                    id="logoutBtn">

                    ↪

                </button>


            </div>

        </div>

    </aside>


    <main class="content">

        <section class="heading">

            <h1>🎒 Trip Checklist</h1>

            <p>
                Prepare everything you need before your journey.
            </p>

        </section>


        <section class="checklist-box">

            <h2>My Checklist</h2>


            <div class="input-area">

                <input
                    type="text"
                    id="itemInput"
                    placeholder="Enter item e.g. Trek shoes"
                >

                <button id="addBtn">
                    Add
                </button>

            </div>


            <ul id="checklist"></ul>


            <p id="emptyMessage">
                No checklist items yet.
            </p>

        </section>

    </main>


    <script src="checklist.js"></script>

</body>

</html>
