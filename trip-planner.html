<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrekPlan - Smart Trip Planner</title>

    <link rel="stylesheet" href="trip-planner.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <h1>🏔️ TrekPlan</h1>

        <a href="dashboard.html">
            Dashboard
        </a>

    </header>


    <!-- MAIN -->
    <main class="container">

        <section class="planner">

            <div class="heading">

                

                <h2>Smart Trip Planner</h2>

                <p>
                    Plan your journey and manage your trip details easily.
                </p>

            </div>


            <!-- FORM -->
            <form id="tripForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            Trip Name
                        </label>

                        <input
                            type="text"
                            id="tripName"
                            placeholder="Example: Manali Adventure"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Destination
                        </label>

                        <input
                            type="text"
                            id="destination"
                            placeholder="Example: Manali"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Start Date
                        </label>

                        <input
                            type="date"
                            id="startDate"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            End Date
                        </label>

                        <input
                            type="date"
                            id="endDate"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Travelers
                        </label>

                        <input
                            type="number"
                            id="travelers"
                            min="1"
                            placeholder="2"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Budget ₹
                        </label>

                        <input
                            type="number"
                            id="budget"
                            min="1"
                            placeholder="20000"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="plan-btn"
                >
                    ✨ Create Smart Plan
                </button>

            </form>


            <!-- TRIP RESULT -->

            <section
                id="tripResult"
                class="trip-result hidden"
            >

                <div class="result-header">

                    <div>

                        <span>YOUR TRIP</span>

                        <h2 id="resultName">
                            Trip Name
                        </h2>

                    </div>

                    <div class="destination">
                        📍 <span id="resultDestination"></span>
                    </div>

                </div>


                <!-- SUMMARY -->

                <div class="summary-grid">

                    <div class="summary-card">

                        <span>📅 Duration</span>

                        <strong id="resultDuration">
                            0 Days
                        </strong>

                    </div>


                    <div class="summary-card">

                        <span>👥 Travelers</span>

                        <strong id="resultTravelers">
                            0
                        </strong>

                    </div>


                    <div class="summary-card">

                        <span>💰 Budget</span>

                        <strong id="resultBudget">
                            ₹0
                        </strong>

                    </div>


                    <div class="summary-card">

                        <span>💵 Per Person</span>

                        <strong id="resultPerPerson">
                            ₹0
                        </strong>

                    </div>

                </div>


                <!-- TRIP DATES -->

                <div class="dates">

                    <div>

                        <small>
                            START
                        </small>

                        <p id="resultStart"></p>

                    </div>


                    <div>

                        <small>
                            END
                        </small>

                        <p id="resultEnd"></p>

                    </div>

                </div>


                <!-- RECOMMENDATION -->

                <div class="recommendation">

                    <h3>
                        🧠 Smart Planning Tip
                    </h3>

                    <p id="recommendationText"></p>

                </div>


                <button
                    id="saveTripBtn"
                    class="save-btn"
                >
                    💾 Save Trip
                </button>

            </section>

        </section>

    </main>


    <script src="trip-planner.js"></script>

</body>

</html>
