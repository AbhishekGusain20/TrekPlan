<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Journal | TrekPlan</title>

    <link rel="stylesheet" href="journal.css">
</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar" id="sidebar">

        <!-- Logo -->
        <div class="sidebar-logo">
            <img src="TrekPlan-logo.png" alt="TrekPlan">
        </div>


        <!-- Navigation -->

        <nav class="sidebar-nav">

            <p class="nav-title">MAIN MENU</p>

            <a href="dashboard.html" class="nav-link ">
                <span class="nav-icon">⌂</span>
                <span>Dashboard</span>
            </a>

            <a href="dashboard.html#trips" class="nav-link">
                <span class="nav-icon">✈</span>
                <span>My Trips</span>
            </a>

            <a href="explore.html" class="nav-link">
                <span class="nav-icon">◎</span>
                <span>Explore</span>
            </a>

            <a href="budget.html" class="nav-link">
                <span class="nav-icon">₹</span>
                <span>Budget Planner</span>
            </a>

            <a href="journal.html" class="nav-link active">
                <span class="nav-icon">▤</span>
                <span>Travel Journal</span>
            </a>

            <a href="map.html" class="nav-link">
                <span class="nav-icon">⌖</span>
                <span>Maps</span>
            </a>

            <a href="checklist.html" class="nav-link">
                <span class="nav-icon">✓</span>
                <span>Checklists</span>
            </a>

            <a href="community.html" class="nav-link">
                <span class="nav-icon">♧</span>
                <span>Community</span>
            </a>

        </nav>


        <!-- Bottom Navigation -->

        <div class="sidebar-bottom">

            <a href="settings.html" class="nav-link">
                <span class="nav-icon">⚙</span>
                <span>Settings</span>
            </a>


            <!-- User -->

            <div class="user-profile">

                <div class="user-avatar">
                    A
                </div>

                <div class="user-info">

                    <strong>AVI</strong>

                    <span>Traveler</span>

                </div>

                <button
                    class="user-menu"
                    id="logoutBtn"
                    title="Logout">
                    ↪
                </button>

            </div>

        </div>

    </aside>


    <main class="container">

        <h1>My Travel Journal 📖</h1>

        <p class="subtitle">
            Save your favourite travel memories and experiences.
        </p>


        <!-- JOURNAL FORM -->

        <section class="journal-form">

            <h2 id="formTitle">
                Add Travel Memory
            </h2>

            <form id="journalForm">

                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="e.g. Kedarkantha"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="rating">
                        Rating
                    </label>

                    <select id="rating" required>

                        <option value="">
                            Select Rating
                        </option>

                        <option value="1">
                            ⭐ 1/5
                        </option>

                        <option value="2">
                            ⭐⭐ 2/5
                        </option>

                        <option value="3">
                            ⭐⭐⭐ 3/5
                        </option>

                        <option value="4">
                            ⭐⭐⭐⭐ 4/5
                        </option>

                        <option value="5">
                            ⭐⭐⭐⭐⭐ 5/5
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="experience">
                        Your Experience
                    </label>

                    <textarea
                        id="experience"
                        rows="5"
                        placeholder="Write about your trip..."
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="photo">
                        Travel Photo 📸
                    </label>

                    <input
                        type="file"
                        id="photo"
                        accept="image/*"
                    >

                </div>


                <!-- PHOTO PREVIEW -->

                <div id="photoPreview"></div>


                <div class="form-buttons">

                    <button
                        type="submit"
                        id="saveBtn"
                    >
                        Save Memory
                    </button>


                    <button
                        type="button"
                        id="cancelBtn"
                        class="cancel-btn"
                        style="display:none;"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- JOURNAL MEMORIES -->

        <section class="memories-section">

            <h2>
                My Memories ❤️
            </h2>

            <div id="memoriesContainer">

                <!-- Memories will appear here -->

            </div>

        </section>

    </main>


    <script src="journal.js"></script>

</body>

</html>
