<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up — TrekPlan</title>

    <link
        rel="stylesheet"
        href="signup.css"
    >

</head>


<body>

    <div class="signup-container">

        <div class="signup-card">


            <!-- ================= LOGO ================= -->

            <div class="logo">

                <img
                    src="trekplan-icon.png"
                    alt="TrekPlan Logo"
                >

            </div>


            <!-- ================= TITLE ================= -->

            <h1>
                Create Account
            </h1>

            <p class="subtitle">
                Start planning your next adventure with TrekPlan.
            </p>


            <!-- ================= ERROR MESSAGE ================= -->

            <div
                id="formError"
                class="form-error"
            ></div>


            <!-- ================= SIGNUP FORM ================= -->

            <form id="signupForm">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- TERMS -->

                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        I agree to the Terms & Conditions

                    </label>

                </div>


                <!-- CREATE ACCOUNT BUTTON -->

                <button
                    type="submit"
                    class="signup-btn"
                >
                    Create Account
                </button>

            </form>


            <!-- ================= LOGIN ================= -->

            <p class="login-link">

                Already have an account?

                <a href="login.html">
                    Log in
                </a>

            </p>


        </div>

    </div>


    <!-- JavaScript -->

    <script src="signup.js"></script>

</body>

</html>
